name: Build and deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'BOOK_TOC.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow GITHUB_TOKEN to push to gh-pages and Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history (mike uses it for versioning)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs and theme
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Mirror BOOK_TOC.md into book/toc.md
        # MkDocs only serves files inside docs_dir (book/).  We keep
        # BOOK_TOC.md at the repo root for git-clone convenience and
        # copy it into book/ at build time.
        run: |
          cp BOOK_TOC.md book/toc.md

      - name: Build site
        run: mkdocs build --strict
        env:
          # Site URL will be set by the deploy step; let MkDocs ignore it during build
          ENABLE_PDF_EXPORT: 0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
