name: Build and deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'BOOK_TOC.md'
      - 'requirements-docs.txt'
      - 'requirements-pdf.txt'
      - 'tools/build_book_pdf.py'
      - 'tools/book_pdf.css'
      - 'tools/test_build_book_pdf.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow GITHUB_TOKEN to push to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-pdf.txt

      - name: Install Sphinx and theme
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pdf.txt

      - name: Install PDF rendering libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-noto-core fonts-noto-cjk

      - name: Mirror BOOK_TOC.md into book/toc.md
        # The site only serves files inside book/; we keep BOOK_TOC.md at the
        # repo root for git-clone convenience and copy it in at build time.
        run: |
          cp BOOK_TOC.md book/toc.md

      - name: Build Sphinx HTML
        # --keep-going: report all warnings, don't stop at the first.
        # We intentionally do NOT pass -W (warnings-as-errors) on the first pass —
        # add it back once the build is clean.
        run: |
          sphinx-build -b html --keep-going book book/_build/html

      - name: Export the whole book as one PDF
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/build_book_pdf.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
